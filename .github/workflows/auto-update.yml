name: Actualizar La Báscula (diario)

# Cada día: trae lo último del repo público de Mi Congre, aplica las migraciones a la base D1
# y despliega el Worker en la cuenta de Cloudflare de La Báscula. No depende de la computadora de nadie.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token de la cuenta de Cloudflare (plantilla «Edit Cloudflare Workers» + D1 Edit)
#   CLOUDFLARE_ACCOUNT_ID  ID de la cuenta de Cloudflare
#   D1_DATABASE_ID         ID de la base micongre-bascula-db

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Traer lo último del repo público (sincroniza el fork)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync "$GITHUB_REPOSITORY" --branch main

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apuntar wrangler.json a la cuenta y la base de La Báscula
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("wrangler.json", "utf8").replace(/^﻿/, ""));
            c.name = "micongre-bascula";
            c.account_id = process.env.CLOUDFLARE_ACCOUNT_ID;
            c.d1_databases[0].database_id = process.env.D1_DATABASE_ID;
            c.d1_databases[0].database_name = "micongre-bascula-db";
            fs.writeFileSync("wrangler.json", JSON.stringify(c, null, "\t"));
          '

      - run: npm ci --no-audit --no-fund

      - name: Migrar la base
        run: npx wrangler d1 migrations apply DB --remote

      - name: Desplegar
        run: npm run deploy
